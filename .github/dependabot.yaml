version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - "/terraform/live/*"
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
