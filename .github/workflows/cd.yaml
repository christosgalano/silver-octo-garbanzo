# Runs after a merge to main. Plans with the read-only role, re-runs the policy
# check on the exact plan, then waits for approval on the `dev` GitHub
# Environment before applying that saved plan with the environment's apply role.
name: CD

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "policy/**"
      - ".github/workflows/cd.yaml"
      - ".github/actions/**"
  workflow_dispatch:

permissions: {}

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.4
  CONFTEST_VERSION: 0.71.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: terraform/environments/dev
  TF_VAR_allowed_account_ids: '["${{ vars.AWS_ACCOUNT_ID }}"]'

jobs:
  plan:
    name: Plan (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.WORKDIR }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode -out=tfplan | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          terraform show -json tfplan > plan.json
          {
            echo "### Plan: dev"
            echo '```'
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Same policies as the PR, evaluated against the plan that will actually be
      # applied. Catches anything that reached main without going through CI.
      - name: conftest
        run: |
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" conftest
          ./conftest test "${WORKDIR}/plan.json" --policy policy --all-namespaces --no-color

      - name: Upload saved plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-dev
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1 # the plan file can contain sensitive values
          if-no-files-found: error

  apply:
    name: Apply (dev)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewer and main-only deployment branch rule live on this
    # environment. The apply role trusts only tokens issued for it.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.WORKDIR }}
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          terraform-version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-dev
          path: ${{ env.WORKDIR }}

      # Applies exactly what was reviewed. If state moved since the plan,
      # Terraform rejects the stale plan instead of applying something else.
      - name: terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -no-color tfplan
