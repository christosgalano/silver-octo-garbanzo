# Runs on every pull request to main. Every job here is a required status check,
# so a PR cannot merge until static checks, the security scan, the policy tests
# and the plan with policy evaluation are all green.
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.4
  TFLINT_VERSION: v0.64.0
  TRIVY_VERSION: v0.74.0
  OPA_VERSION: 1.21.1
  REGAL_VERSION: 0.43.0
  CONFTEST_VERSION: 0.71.0
  TERRAFORM_DOCS_VERSION: v0.24.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: Format, validate, lint, docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in bootstrap terraform/environments/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -lockfile=readonly
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: terraform-docs is up to date
        run: |
          archive="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/terraform-docs-${TERRAFORM_DOCS_VERSION}.sha256sum" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" terraform-docs
          for dir in terraform/modules/*/ terraform/stacks/*/ terraform/environments/*/ bootstrap/; do
            ./terraform-docs --config .terraform-docs.yml --output-check "${dir}" \
              || { echo "::error::README in ${dir} is stale. Run: pre-commit run terraform_docs --all-files"; exit 1; }
          done

  security:
    name: Trivy misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: trivy config
        run: |
          set -o pipefail
          trivy config --config trivy.yaml --format table . | tee trivy.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Trivy"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  policy-tests:
    name: Policy lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}

      - uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: ${{ env.REGAL_VERSION }}

      - name: opa fmt
        run: opa fmt --fail --list policy

      - name: regal lint
        run: regal lint --format github policy

      - name: opa test (coverage >= 90%)
        run: |
          opa test policy -v
          coverage=$(opa test policy --coverage --format json | jq '.coverage')
          echo "Policy coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { exit !(c >= 90) }' || { echo "::error::Policy coverage ${coverage}% is below 90%"; exit 1; }

  plan:
    name: Plan and policy check (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC to AWS
      pull-requests: write # plan comment
    env:
      WORKDIR: terraform/environments/dev
      TF_VAR_allowed_account_ids: '["${{ vars.AWS_ACCOUNT_ID }}"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.WORKDIR }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          terraform-version: ${{ env.TF_VERSION }}

      # Read-only role, so no state lock. Applies take the lock; PR plans never block them.
      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -o pipefail
          terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
          terraform show -json tfplan > plan.json

      - name: Install conftest
        run: |
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" conftest
          sudo mv conftest /usr/local/bin/

      - name: conftest
        id: conftest
        run: |
          set -o pipefail
          conftest test "${WORKDIR}/plan.json" --policy policy --all-namespaces --no-color | tee conftest.txt

      - name: Comment plan and policy results
        if: always() && steps.plan.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONFTEST_OUTCOME: ${{ steps.conftest.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : 'not run');
            const limit = (s, n) => (s.length > n ? s.slice(0, n) + '\n... truncated, see the job log' : s);
            const plan = read(`${process.env.WORKDIR}/plan.txt`);
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(see log)'])[0];
            const marker = '<!-- terraform-plan-dev -->';
            const body = [
              marker,
              `### Terraform plan: dev`,
              `**${summary}**  ·  policy check: **${process.env.CONFTEST_OUTCOME}**`,
              '',
              '<details><summary>conftest</summary>',
              '',
              '```',
              limit(read('conftest.txt'), 20000),
              '```',
              '</details>',
              '',
              '<details><summary>plan</summary>',
              '',
              '```',
              limit(plan, 40000),
              '```',
              '</details>',
              '',
              `Commit ${context.sha.slice(0, 7)} · [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
