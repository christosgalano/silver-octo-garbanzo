# Runs on every pull request to main. Every job here is a required status check,
# so a PR cannot merge until static checks, the security scan, the policy tests
# and the plan with policy evaluation are all green.
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.4
  TFLINT_VERSION: v0.64.0
  TRIVY_VERSION: v0.74.0
  OPA_VERSION: 1.21.1
  REGAL_VERSION: 0.43.0
  CONFTEST_VERSION: 0.71.0
  TERRAFORM_DOCS_VERSION: v0.24.0
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      units: ${{ steps.changes.outputs.units }}
      environments: ${{ steps.changes.outputs.environments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: What changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/changes.sh "${BASE_SHA}" "${HEAD_SHA}"

  static:
    name: Format, validate, lint, docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in terraform/live/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -lockfile=readonly
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: terraform-docs is up to date
        run: |
          archive="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/terraform-docs-${TERRAFORM_DOCS_VERSION}.sha256sum" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" terraform-docs
          for dir in terraform/modules/*/ terraform/stacks/*/ terraform/live/*/; do
            ./terraform-docs --config .terraform-docs.yml --output-check "${dir}" \
              || { echo "::error::README in ${dir} is stale. Run: pre-commit run terraform_docs --all-files"; exit 1; }
          done

  security:
    name: Trivy misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: trivy config
        run: |
          set -o pipefail
          trivy config --config trivy.yaml --format table . | tee trivy.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Trivy"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  policy-tests:
    name: Policy lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ env.OPA_VERSION }}

      - uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: ${{ env.REGAL_VERSION }}

      - name: opa fmt
        run: opa fmt --fail --list policy

      - name: regal lint
        run: regal lint --format github policy

      - name: opa test (coverage >= 90%)
        run: |
          opa test policy -v
          coverage=$(opa test policy --coverage --format json | jq '.coverage')
          echo "Policy coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { exit !(c >= 90) }' || { echo "::error::Policy coverage ${coverage}% is below 90%"; exit 1; }

  plan:
    name: Plan and policy check (${{ matrix.environment }})
    needs: changes
    if: needs.changes.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.changes.outputs.environments) }}
    permissions:
      contents: read
      id-token: write # OIDC to AWS
      pull-requests: write # plan comment
    env:
      WORKDIR: terraform/live/${{ matrix.environment }}
      # Per-environment settings are repository variables prefixed with the
      # environment name: DEV_AWS_ACCOUNT_ID, DEV_TF_STATE_BUCKET, DEV_AWS_PLAN_ROLE_ARN.
      TF_VAR_allowed_account_ids: ${{ format('["{0}"]', vars[format('{0}_AWS_ACCOUNT_ID', matrix.environment)]) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.WORKDIR }}
          role-to-assume: ${{ vars[format('{0}_AWS_PLAN_ROLE_ARN', matrix.environment)] }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars[format('{0}_TF_STATE_BUCKET', matrix.environment)] }}
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          # Default outputs so reporting is deterministic even on early failures.
          echo "plan_has_changes=false" >> "$GITHUB_OUTPUT"
          echo "create_count=0" >> "$GITHUB_OUTPUT"
          echo "update_count=0" >> "$GITHUB_OUTPUT"
          echo "delete_count=0" >> "$GITHUB_OUTPUT"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

          # Read-only role, so no state lock: plans never block an apply.
          PLAN_ARGS=(-out=tfplan -lock=false)
          echo "Running: terraform plan -detailed-exitcode ${PLAN_ARGS[*]}"

          # set +e around the pipeline so the expected codes (0 = no changes,
          # 2 = changes) don't abort the step and PIPESTATUS stays reliable.
          set +e
          terraform plan -detailed-exitcode "${PLAN_ARGS[@]}" 2>&1 | tee plan.raw
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Strip ANSI colour codes for the report copy.
          awk '{ gsub(/\033\[[0-9;]*[[:alpha:]]/, ""); print }' plan.raw > plan.out

          echo "Terraform plan exit code: ${EXIT_CODE}"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          case "${EXIT_CODE}" in
            0|2) ;;
            *) echo "Terraform plan failed with exit code ${EXIT_CODE}"; exit "${EXIT_CODE}" ;;
          esac

          PLAN_SUMMARY="$(awk '/^Plan:/ { line=$0 } END { print line }' plan.out)"
          CREATE_COUNT="$(printf '%s\n' "${PLAN_SUMMARY}" | sed -E 's/.* ([0-9]+) to add.*/\1/; t; s/.*/0/')"
          UPDATE_COUNT="$(printf '%s\n' "${PLAN_SUMMARY}" | sed -E 's/.* ([0-9]+) to change.*/\1/; t; s/.*/0/')"
          DELETE_COUNT="$(printf '%s\n' "${PLAN_SUMMARY}" | sed -E 's/.* ([0-9]+) to destroy.*/\1/; t; s/.*/0/')"
          echo "Plan summary: ${CREATE_COUNT} to add, ${UPDATE_COUNT} to change, ${DELETE_COUNT} to destroy."

          [ "${EXIT_CODE}" = "2" ] && PLAN_HAS_CHANGES=true || PLAN_HAS_CHANGES=false
          echo "plan_has_changes=${PLAN_HAS_CHANGES}" >> "$GITHUB_OUTPUT"
          echo "create_count=${CREATE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "update_count=${UPDATE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "delete_count=${DELETE_COUNT}" >> "$GITHUB_OUTPUT"

          # Machine-readable plan for conftest.
          terraform show -json tfplan > plan.json

      - name: Install conftest
        run: |
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" conftest
          sudo mv conftest /usr/local/bin/

      - name: conftest
        id: conftest
        run: |
          set -o pipefail
          conftest test "${WORKDIR}/plan.json" --policy policy --all-namespaces --no-color | tee conftest.txt

      - name: Policy results (Markdown)
        if: always() && steps.plan.outcome == 'success'
        run: |
          {
            if [ "${{ steps.conftest.outcome }}" = "success" ]; then
              echo "**Policy check (conftest) passed**"
            else
              echo "**Policy check (conftest) failed**"
            fi
            echo
            echo "<details><summary>Show policy output</summary>"
            echo
            echo '```'
            cat conftest.txt 2>/dev/null || echo "not run"
            echo '```'
            echo "</details>"
          } > policy.md

      - name: Publish Terraform report (plan)
        if: always()
        uses: ./.github/actions/terraform-report
        with:
          environment: ${{ matrix.environment }}
          working-directory: ${{ env.WORKDIR }}
          phase: plan
          command: terraform plan -chdir=${{ env.WORKDIR }} -lock=false
          log-path: ${{ env.WORKDIR }}/plan.out
          outcome: ${{ steps.plan.outcome || 'failure' }}
          exit-code: ${{ steps.plan.outputs.exit_code || '1' }}
          extra-markdown-path: policy.md

  tests:
    name: Terraform test (${{ matrix.unit }})
    needs: changes
    if: needs.changes.outputs.units != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJson(needs.changes.outputs.units) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Mocked provider: no AWS credentials, nothing is created.
      - name: terraform test
        working-directory: ${{ matrix.unit }}
        run: |
          terraform init -backend=false
          terraform test

  # The only required status check. Matrix jobs are named per unit/environment
  # and are skipped when nothing relevant changed, so branch protection points
  # here instead: it fails if anything it depends on failed or was cancelled.
  gate:
    name: CI gate
    if: always()
    needs: [changes, static, security, policy-tests, tests, plan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "${RESULTS}" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
