name: Terraform setup
description: Install Terraform, assume an AWS role through OIDC and run terraform init against the S3 backend.

inputs:
  working-directory:
    description: Terraform root module.
    required: true
  role-to-assume:
    description: IAM role ARN to assume with the job's OIDC token.
    required: true
  aws-region:
    description: AWS region.
    required: true
  state-bucket:
    description: S3 bucket holding Terraform state.
    required: true
  terraform-version:
    description: Terraform version.
    required: true

runs:
  using: composite
  steps:
    - name: Install Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
        aws-region: ${{ inputs.aws-region }}

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
